<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="900" viewBox="0 0 1260 900" font-family="'Microsoft JhengHei','PingFang TC','Noto Sans TC',sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#37474f"/></marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker>
    <style>
      .t{font-size:16px;fill:#212121;text-anchor:middle}
      .s{font-size:12px;fill:#546e7a;text-anchor:middle}
      .h{font-size:20px;font-weight:bold;fill:#212121}
      .lbl{font-size:12px;fill:#2e7d32;text-anchor:middle;font-weight:bold}
      .num{font-size:13px;font-weight:bold;fill:#fff;text-anchor:middle}
    </style>
  </defs>
  <rect width="1260" height="900" fill="#fafafa"/>
  <text x="630" y="38" class="h" text-anchor="middle" style="font-size:26px">庫存管理流程圖 Inventory Workflow</text>
  <text x="630" y="62" class="s" style="font-size:14px">庫存是在「出貨單」確認時才真正扣除;發票/收據只是帳務,不動庫存</text>

  <!-- lane backgrounds -->
  <rect x="30" y="85" width="1200" height="110" rx="12" fill="#e3f2fd" stroke="#90caf9"/>
  <text x="45" y="106" class="h" style="font-size:15px;fill:#1565c0">A. 進貨 Purchasing</text>
  <rect x="30" y="285" width="1200" height="130" rx="12" fill="#e8f5e9" stroke="#a5d6a7"/>
  <text x="45" y="306" class="h" style="font-size:15px;fill:#2e7d32">B. 庫存 Stock(每個分校各自一份)</text>
  <rect x="30" y="535" width="1200" height="210" rx="12" fill="#fff3e0" stroke="#ffcc80"/>
  <text x="45" y="556" class="h" style="font-size:15px;fill:#e65100">C. 銷售 Sales</text>

  <!-- Purchasing -->
  <rect x="60" y="115" width="150" height="64" rx="8" fill="#fff" stroke="#1976d2" stroke-width="2"/>
  <text x="135" y="143" class="t">供應商</text><text x="135" y="163" class="s">Suppliers</text>
  <line x1="210" y1="147" x2="278" y2="147" stroke="#37474f" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="280" y="115" width="150" height="64" rx="8" fill="#fff" stroke="#1976d2" stroke-width="2"/>
  <text x="355" y="143" class="t">採購單 PO</text><text x="355" y="163" class="s">草稿 → 下單</text>
  <circle cx="280" cy="115" r="12" fill="#1976d2"/><text x="280" y="120" class="num">1</text>
  <line x1="430" y1="147" x2="498" y2="147" stroke="#37474f" stroke-width="2" marker-end="url(#arr)"/>
  <text x="464" y="138" class="s">收貨</text>
  <rect x="500" y="115" width="150" height="64" rx="8" fill="#fff" stroke="#1976d2" stroke-width="2"/>
  <text x="575" y="143" class="t">收貨單 GRN</text><text x="575" y="163" class="s">可分批收貨</text>
  <circle cx="500" cy="115" r="12" fill="#1976d2"/><text x="500" y="120" class="num">2</text>
  <rect x="940" y="115" width="170" height="64" rx="8" fill="#fff" stroke="#1976d2" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="1025" y="143" class="t">採購退貨 PRT</text><text x="1025" y="163" class="s">(選用)退給供應商</text>

  <!-- Stock -->
  <rect x="470" y="320" width="420" height="80" rx="10" fill="#fff" stroke="#2e7d32" stroke-width="3"/>
  <text x="680" y="350" class="t" style="font-size:20px;font-weight:bold">庫存 Stock</text>
  <text x="680" y="372" class="s">實際數量 = 保留 Reserved + 可用 Available</text>
  <text x="680" y="390" class="s">每筆異動寫入流水帳(不可修改)</text>
  <line x1="575" y1="179" x2="575" y2="318" stroke="#2e7d32" stroke-width="3" marker-end="url(#arrG)"/>
  <text x="640" y="245" class="lbl">確認收貨:入庫</text>
  <text x="640" y="262" class="lbl">+ 更新加權平均成本</text>
  <line x1="800" y1="320" x2="1010" y2="181" stroke="#2e7d32" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrG)"/>
  <text x="935" y="258" class="lbl">退貨:出庫</text>

  <rect x="60" y="322" width="300" height="76" rx="8" fill="#fff" stroke="#2e7d32" stroke-width="2"/>
  <text x="210" y="348" class="t">庫存調整</text>
  <text x="210" y="368" class="s">入庫 / 出庫(報廢、遺失、贈送…)</text>
  <text x="210" y="386" class="s">調撥 Transfer / 盤點 Stocktake</text>
  <line x1="360" y1="360" x2="468" y2="360" stroke="#2e7d32" stroke-width="2.5" marker-end="url(#arrG)"/>

  <rect x="1000" y="325" width="200" height="70" rx="8" fill="#fff" stroke="#6a1b9a" stroke-width="2"/>
  <text x="1100" y="352" class="t">報表 · Dashboard</text>
  <text x="1100" y="372" class="s">低庫存 / 逾期提醒 / 通知</text>
  <text x="1100" y="387" class="s">(6 種報表可匯出 CSV)</text>
  <line x1="890" y1="360" x2="998" y2="360" stroke="#6a1b9a" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Sales -->
  <rect x="60" y="585" width="150" height="64" rx="8" fill="#fff" stroke="#ef6c00" stroke-width="2"/>
  <text x="135" y="613" class="t">客戶 Customers</text><text x="135" y="633" class="s">可由學生一鍵建立</text>
  <line x1="210" y1="617" x2="288" y2="617" stroke="#37474f" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="290" y="585" width="170" height="64" rx="8" fill="#fff" stroke="#ef6c00" stroke-width="2"/>
  <text x="375" y="613" class="t">銷售訂單 SO</text><text x="375" y="633" class="s">草稿 → 確認</text>
  <circle cx="290" cy="585" r="12" fill="#ef6c00"/><text x="290" y="590" class="num">3</text>
  <line x1="375" y1="585" x2="510" y2="402" stroke="#2e7d32" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrG)"/>
  <text x="400" y="480" class="lbl">確認:保留庫存</text>
  <text x="400" y="497" class="lbl">(Reserved,還沒扣)</text>

  <line x1="460" y1="617" x2="538" y2="617" stroke="#37474f" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="540" y="585" width="170" height="64" rx="8" fill="#fff" stroke="#ef6c00" stroke-width="2"/>
  <text x="625" y="613" class="t">出貨單 DO</text><text x="625" y="633" class="s">可分批出貨</text>
  <circle cx="540" cy="585" r="12" fill="#ef6c00"/><text x="540" y="590" class="num">4</text>
  <line x1="640" y1="585" x2="640" y2="402" stroke="#2e7d32" stroke-width="3" marker-end="url(#arrG)"/>
  <text x="730" y="505" class="lbl">出貨確認:真正扣庫存</text>
  <text x="730" y="522" class="lbl">(釋放保留量)</text>

  <line x1="710" y1="617" x2="788" y2="617" stroke="#37474f" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="790" y="585" width="170" height="64" rx="8" fill="#fff" stroke="#ef6c00" stroke-width="2"/>
  <text x="875" y="613" class="t">發票 Invoice</text><text x="875" y="633" class="s">草稿 → 開立(不可改)</text>
  <circle cx="790" cy="585" r="12" fill="#ef6c00"/><text x="790" y="590" class="num">5</text>

  <line x1="960" y1="617" x2="1038" y2="617" stroke="#37474f" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="1040" y="585" width="170" height="64" rx="8" fill="#fff" stroke="#ef6c00" stroke-width="2"/>
  <text x="1125" y="613" class="t">收據 Receipt</text><text x="1125" y="633" class="s">可分次收款</text>
  <circle cx="1040" cy="585" r="12" fill="#ef6c00"/><text x="1040" y="590" class="num">6</text>

  <rect x="290" y="672" width="170" height="52" rx="8" fill="#fff" stroke="#9e9e9e" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="375" y="695" class="t" style="font-size:14px">形式發票 Proforma</text><text x="375" y="713" class="s">列印報價,不動庫存</text>
  <line x1="375" y1="649" x2="375" y2="670" stroke="#9e9e9e" stroke-width="2" stroke-dasharray="4 3"/>

  <rect x="790" y="672" width="250" height="52" rx="8" fill="#fff" stroke="#c62828" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="915" y="695" class="t" style="font-size:14px">貸項單 Credit Note(退貨)</text><text x="915" y="713" class="s">可選退回庫存;不能退已付款的部分</text>
  <line x1="875" y1="649" x2="875" y2="670" stroke="#c62828" stroke-width="2" stroke-dasharray="4 3"/>

  <!-- Quick fulfill -->
  <rect x="30" y="765" width="1200" height="48" rx="10" fill="#fffde7" stroke="#fbc02d" stroke-width="2"/>
  <text x="630" y="787" class="t" style="font-weight:bold">快速通道:Sales Orders →「Quick Fulfill &amp; Invoice」</text>
  <text x="630" y="806" class="s" style="font-size:13px">一次完成 確認訂單 → 出貨 → 開立發票 →(可選)收款;任何一步失敗就整批取消</text>

  <!-- Rules -->
  <text x="45" y="842" class="s" style="text-anchor:start;font-size:13px">規則提醒:</text>
  <text x="115" y="842" class="s" style="text-anchor:start;font-size:13px">① 已確認 / 已開立的單據不能修改,只能作廢或退貨  ② 庫存不能變負數  ③ 發票收款不能超過餘額  ④ 作廢順序:收據 → 發票 → 出貨單</text>
  <text x="45" y="865" class="s" style="text-anchor:start;font-size:13px">圖例:</text>
  <line x1="95" y1="861" x2="135" y2="861" stroke="#2e7d32" stroke-width="3" marker-end="url(#arrG)"/>
  <text x="143" y="865" class="s" style="text-anchor:start;font-size:13px">改變庫存數量</text>
  <line x1="245" y1="861" x2="285" y2="861" stroke="#2e7d32" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrG)"/>
  <text x="293" y="865" class="s" style="text-anchor:start;font-size:13px">保留 / 選用的庫存影響</text>
  <line x1="440" y1="861" x2="480" y2="861" stroke="#37474f" stroke-width="2" marker-end="url(#arr)"/>
  <text x="488" y="865" class="s" style="text-anchor:start;font-size:13px">單據流向(不動庫存)</text>
  <text x="630" y="888" class="s" style="font-size:12px">步驟編號 1→6 即建議的操作順序;虛線框為選用步驟</text>
</svg>
